name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm publish --provenance (Sigstore attestation via GitHub OIDC).
      # This is separate from npm Trusted Publishing: NPM_TOKEN still authenticates to the registry.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build package
        run: npm run build

      - name: Lint package
        run: npm run lint -c .eslintrc.prepublish.js nodes credentials package.json

      # NPM_TOKEN = registry login. id-token:write = provenance attestation (build came from this workflow).
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
