name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do not set registry-url here: it injects token-based auth and breaks
          # Trusted Publishing (OIDC). Default registry is registry.npmjs.org.

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Lint package
        run: npm run lint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Clear token-style npm auth (use OIDC only)
        run: npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true

      - name: Publish with provenance
        run: npm publish --provenance --access public
